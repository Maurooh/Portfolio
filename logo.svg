    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#fundo)"/>
  <text x="32" y="42" text-anchor="middle" font-family="Geist, Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#fff" letter-spacing="-1">MS</text>
</svg>
